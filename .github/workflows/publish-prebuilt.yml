name: Test prebuilt artifacts

on:
  push:
    branches: [users/IanWood1/vulkan-cts-release-test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - name: Checkout corpus
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 ninja-build pkg-config libpng-dev libdrm-dev libvulkan1
          python -m pip install "cmake==3.31.10" -r corpus/vulkan/requirements.txt

      - name: Build pinned Vulkan CTS
        run: bash scripts/build_vulkan_cts.sh

      - name: Package Vulkan CTS
        run: |
          mkdir -p dist
          runtime_dir=".build/vulkan-cts/build/external/vulkancts/modules/vulkan"
          # Dereference data symlinks so the archive needs no CTS source tree.
          tar --dereference -czf dist/vulkan-cts-linux-x64.tar.gz \
            "${runtime_dir}/deqp-vk" "${runtime_dir}/vulkan"
          cp .build/vulkan-cts/src/LICENSE dist/vulkan-cts-LICENSE

      - name: Checksum release assets
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      - name: Verify packaged CTS
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          extract_dir="$(mktemp -d)"
          tar -xzf vulkan-cts-linux-x64.tar.gz -C "${extract_dir}"
          runtime_dir="${extract_dir}/.build/vulkan-cts/build/external/vulkancts/modules/vulkan"
          test -x "${runtime_dir}/deqp-vk"
          test -d "${runtime_dir}/vulkan"
          "${runtime_dir}/deqp-vk" --help

      - name: Upload test artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuilt-test-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
