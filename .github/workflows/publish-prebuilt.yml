name: Publish prebuilt artifacts

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - name: Checkout corpus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 ninja-build pkg-config libpng-dev libdrm-dev libvulkan1
          python -m pip install "cmake==3.31.10" -r corpus/vulkan/requirements.txt

      - name: Build pinned Vulkan CTS
        run: bash scripts/build_vulkan_cts.sh

      - name: Package Vulkan CTS
        run: |
          mkdir -p dist
          runtime_dir=".build/vulkan-cts/build/external/vulkancts/modules/vulkan"
          # Dereference data symlinks so the archive needs no CTS source tree.
          tar --dereference -czf dist/vulkan-cts-linux-x64.tar.gz \
            "${runtime_dir}/deqp-vk" "${runtime_dir}/vulkan"
          cp .build/vulkan-cts/src/LICENSE dist/vulkan-cts-LICENSE

      - name: Checksum release assets
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="prebuilt-${GITHUB_SHA}"
          gh release create "${release_tag}" dist/* \
            --target "${GITHUB_SHA}" \
            --title "${release_tag}" \
            --notes "Prebuilt corpus dependencies. Verify downloads with SHA256SUMS. The tagged workflow records the build settings." \
            --prerelease --latest=false
