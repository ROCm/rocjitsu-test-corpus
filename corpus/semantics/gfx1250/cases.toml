[results.wmma_scale16_m16_test]
records = [
  { case = "Scale16 M16 GEMM tile", variants = 3 },
  { case = "Scale16 M16 nonuniform tile", variants = 3 },
]

[results.wmma_scale16_m32_test]
records = [
  { case = "Scale16 M32 GEMM tile", variants = 1 },
  { case = "Scale16 M32 nonuniform tile", variants = 1 },
]

[results.wmma_split_f16_test]
records = [
  { case = "K128 f16 WMMA tile", variants = 4 },
  { case = "K128 f16 nonuniform tile", variants = 4 },
]

[results.wmma_split_f32_test]
records = [
  { case = "K128 f32 WMMA tile", variants = 4 },
  { case = "K128 f32 nonuniform tile", variants = 4 },
]

[results.wmma_split_fp4_test]
records = [
  { case = "M32 FP4 WMMA tile", variants = 1 },
  { case = "M32 FP4 nonuniform tile", variants = 1 },
]
