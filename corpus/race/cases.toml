#
# Race-detection corpus: kernel inventory.
#
# Each case names one independently buildable HIP kernel, the targets its
# device assembly is pinned for, and the hazard it is built to exercise.
# scripts/regenerate_asm.py compiles every case for each of its targets into
# asm/<target>/<kernel>.s, and scripts/check_cases.py checks this inventory
# against kernels/ and asm/ without a compiler. The mutants derived from the
# cases live in mutants.toml, which scripts/generate.py writes.
#
# [corpus] targets lists the gfx targets the corpus is built for. Adding a target
# is a deliberate edit here: both scripts read this list, so it is what a
# missing asm/<target>/ directory is checked against.
#
# Fields:
#   id           stable selector, also used to build CorpusCase ids
#   kernel       basename under kernels/, without .hip
#   targets      the corpus targets this kernel assembles for; empty or absent means
#                every one of them
#   headers      optional: headers outside ROCm's defaults the kernel includes.
#                When any is not on the include path, regenerate_asm.py skips
#                the case and does not update any target it builds for: each
#                such target keeps all of its committed listings and its recipe.
#   mutate       mutation kinds this kernel opts into: "wait" and/or "memory"
#   hazard       the hazard pattern the kernel is written around. It describes
#                the kernel; each mutant's tag is derived from its own site.
#                See "Tags" below.
#   waits        the wait counters the committed assembly waits on, as a table
#                keyed by target: one entry per target the case builds for,
#                each listing exactly the counters some wait in
#                asm/<target>/<kernel>.s drains. See "Waits" below.
#                scripts/check_cases.py verifies it against the assembly.
#   exempt       optional [[case.exempt]] entries: mutations that provably
#                introduce no race, so reporting nothing is correct and the
#                mutant is not scored. Each names a site and a `reason`; see
#                "Pinned sites" below.
#   tag          optional [[case.tag]] entries: the `resource` and `hazard` of
#                a site whose derived tag is wrong, or that has none, with the
#                `reason`. Each names a site; see "Pinned sites" below.
#
# Waits
#   Counters are spelled as each target's assembly spells them, because the
#   targets do not share a counter set:
#     gfx950   one combined `s_waitcnt` names its counters in the operand:
#              vmcnt (vector memory) and lgkmcnt (LDS, scalar memory and
#              messages, as one counter).
#     gfx1250  split mnemonics name the counter: s_wait_loadcnt, _storecnt,
#              _dscnt (LDS), _kmcnt (scalar memory), _tensorcnt, ...
#   `waits` names counters, not wait instructions. A wait naming two counters
#   -- `s_waitcnt vmcnt(0) lgkmcnt(0)` on gfx950, `s_wait_loadcnt_dscnt` on
#   gfx1250 -- drains both, so both are listed, even where no single-counter
#   wait for either appears (pointer_chase's gfx1250 dscnt comes only from
#   s_wait_loadcnt_dscnt, a distinct instruction from s_wait_dscnt). It is
#   still one mutation site: removing it removes both waits.
#   `s_wait_xcnt` is out of scope by choice; it is never a mutation site and is
#   never listed. It does guard a hazard: XCNT tracks memory instructions whose
#   address translation may still be replayed (XNACK replay), and the wait keeps
#   a later instruction from overwriting a source register, such as a buffer
#   descriptor, that a replayed one needs. That hazard appears only when a
#   translation is replayed, and on targets without shader XNACK replay the
#   wait is a NOP; the corpus scores data-completion hazards. See
#   DEFAULT_EXCLUDED_WAITS in scripts/mutate.py.
#
# Tags
#   Each mutant is tagged with the resource and hazard kind its mutation
#   exposes, which is what a detector's capability is matched against.
#   scripts/generate.py derives them from the site, with scripts/exposure.py:
#   it finds the operations the removed wait would have retired, and the first
#   later instruction that depends on one of them before another wait does.
#     reads a register an exposed load still writes  -> RAW on sgpr/vgpr/agpr
#     writes that register first                     -> WAW on it
#     DS access after an exposed tensor or async
#       transfer into LDS                            -> RAW or WAW on lds
#     DS write after an exposed transfer out of LDS  -> WAR on lds
#     barrier while an LDS access is still in flight -> LocalMemoryRace on lds
#   So removing an lgkmcnt or dscnt wait after a DS read exposes the read's
#   destination register (vgpr RAW), not LDS: a wave's DS operations complete
#   in order, so its own later DS accesses do not depend on it. Removing one
#   before a barrier, after a DS write, lets another wave's access after the
#   barrier race it (LocalMemoryRace). RAW, WAR and WAW are dependencies inside
#   one wave; LocalMemoryRace is a dependency between waves.
#   A load rewritten as a store (`memory` kind) races other threads' reads of
#   the same memory, so it takes the load's address space: global_ and
#   buffer_ -> global (GlobalMemoryRace), ds_ -> lds (LocalMemoryRace).
#   Where the derivation is wrong, or finds nothing to tag -- a wait that
#   retires nothing, a flat or scratch memory site, or a global access in
#   flight at a barrier, which the vocabulary has no kind for -- generation
#   fails until a [[case.tag]] gives the tag, or the site is exempted.
#
# Pinned sites
#   An exemption or tag override names its site by `kind`, `ordinal` and the
#   `site` signature found there: the instruction without its comment,
#   whitespace collapsed, such as "s_waitcnt lgkmcnt(0)". `ordinal` counts the
#   sites of that kind in asm/<target>/<kernel>.s: 0-based, in file order, in
#   one domain shared by every counter, skipping comment and directive lines
#   and s_wait_xcnt. scripts/check_cases.py and scripts/generate.py both check
#   that the site at the ordinal is that instruction, so a pin cannot drift
#   onto another one, even one with the same mnemonic. The instruction at an
#   ordinal differs between targets, so a pin may name the one `target` it
#   applies to; without one it applies to every target the case builds for.
#
# Resource names are corpus-facing rather than any one detector's internal
# spelling; each adapter maps them onto its own vocabulary.

[corpus]
schema = 1
targets = ["gfx950", "gfx1250"]

# --- Global vector loads -----------------------------------------------------
# These touch global memory, but a removed loadcnt wait races the destination
# register, so their mutants are tagged vgpr rather than global.

[[case]]
id = "add-checked"
kernel = "add_checked"
targets = []
mutate = ["wait"]
hazard = "RAW"
waits = { gfx1250 = ["kmcnt", "loadcnt"], gfx950 = ["lgkmcnt", "vmcnt"] }
description = "Global vector RAW (load then use), bounds checked"

