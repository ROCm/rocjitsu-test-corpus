# Race-detection corpus: kernel-level metadata.
#
# Each case names one independently buildable HIP kernel and the hazard it is
# built to exercise. Tool-specific coverage maps can refer to these stable IDs
# without coupling this corpus to a particular detector or launch mechanism.
#
# This file describes kernels. The mutants derived from them live in
# mutants.toml, which `scripts/generate.py` writes.
#
# Fields:
#   id           stable selector, also used to build CorpusCase ids
#   kernel       basename under kernels/, without .hip
#   requires     gfx targets this kernel assembles for; empty means portable
#   mutate       mutation kinds this kernel opts into: "wait" and/or "memory"
#   hazard       the dominant hazard kind the kernel is built to produce
#   waits        the wait counters the committed assembly waits on, as a table
#                keyed by target: one entry per target the case builds for,
#                each listing exactly the counters some wait in
#                asm/<target>/<kernel>.s drains. See "Waits" below.
#                scripts/check_cases.py verifies it against the assembly.
#   headers      optional: headers outside ROCm's defaults the kernel includes.
#                scripts/regenerate_asm.py skips the case, keeping its
#                committed assembly, when any is not on the include path.
#   resource     optional: pins the resource tag of every mutant in the case.
#                Normally omitted; see "Resources" below.
#
# Waits
#   Counters are spelled as each target's assembly spells them, because the
#   targets do not share a counter set:
#     gfx950   one combined `s_waitcnt` names its counters in the operand:
#              vmcnt (vector memory) and lgkmcnt (LDS, scalar memory and
#              messages, as one counter).
#     gfx1250  split mnemonics name the counter: s_wait_loadcnt, _storecnt,
#              _dscnt (LDS), _kmcnt (scalar memory), _tensorcnt, ...
#   `waits` names counters, not wait instructions. A wait naming two counters
#   -- `s_waitcnt vmcnt(0) lgkmcnt(0)` on gfx950, `s_wait_loadcnt_dscnt` on
#   gfx1250 -- drains both, so both are listed, even where no single-counter
#   wait for either appears (pointer_chase's gfx1250 dscnt comes only from
#   s_wait_loadcnt_dscnt, a distinct instruction from s_wait_dscnt). It is
#   still one mutation site: removing it removes both waits.
#   `s_wait_xcnt` is out of scope. It tracks address-translation replay rather
#   than data completion, so removing it creates no race; it is never a
#   mutation site and is never listed.
#
# Resources
#   A counter alone does not say which resource a removed wait leaves exposed.
#   On gfx950 one lgkmcnt(0) can follow scalar loads (an SGPR destination) and
#   another, a few lines later, DS reads. So the mutant generator,
#   scripts/generate.py, looks back from the removed wait (up to 40 lines) for
#   the nearest memory operation of a kind that counter tracks, and tags the
#   mutant by that operation:
#     s_load / s_buffer_load              -> sgpr
#     ds_* (read or write), tensor_*      -> lds
#     global/flat/buffer/scratch load     -> vgpr (the destination register)
#     global/flat/buffer store            -> vgpr (the source register)
#   The counter limits the search: vmcnt/loadcnt considers vector memory only,
#   dscnt considers DS and vector memory, and lgkmcnt or a combined
#   wait considers all three. kmcnt is always sgpr and tensorcnt always lds.
#   A load rewritten as a store (`memory` kind) races the memory itself, so it
#   takes the load's address space: global_/buffer_ -> global, scratch_ ->
#   scratch, ds_ -> lds. A flat load may touch any of them.
#   Where the generator cannot tell -- a flat memory site, or a wait with no
#   memory operation in reach -- generation fails, and the case settles it with
#   `resource = "..."`. The derived tags are written to mutants.toml for review;
#   they, not any case-level field, say what each mutant tests.
#
# Resource names are corpus-facing rather than any one detector's internal
# spelling; each adapter maps them onto its own vocabulary.

[corpus]
schema = 1
name = "race"

# --- Global vector loads -----------------------------------------------------
# These touch global memory, but a removed loadcnt wait races the destination
# register, so their mutants are tagged vgpr rather than global.

[[case]]
id = "add-checked"
kernel = "add_checked"
requires = []
mutate = ["wait"]
hazard = "RAW"
waits = { gfx1250 = ["kmcnt", "loadcnt"], gfx950 = ["lgkmcnt", "vmcnt"] }
description = "Global vector RAW (load then use), bounds checked"

