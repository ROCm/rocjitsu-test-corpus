# --- Transcendentals ---------------------------------------------------------

[[case]]
id = "trans-sin-cos"
kernel = "trans_sin_cos"
requires = []

[[case]]
id = "trans-rcp-sqrt"
kernel = "trans_rcp_sqrt"
requires = []

[[case]]
id = "trans-chain"
kernel = "trans_chain"
requires = []

# --- WMMA --------------------------------------------------------------------

[[case]]
id = "wmma-exp"
kernel = "wmma_exp"
requires = ["gfx1250"]

[[case]]
id = "wmma-rocwmma"
kernel = "wmma_rocwmma"
requires = ["gfx1250"]
# Needs the rocWMMA headers. regenerate_asm.py looks for them under ROCm's
# include directory and any -I passed with --cxxflags "-I/path/to/include",
# and skips the case -- leaving its committed assembly as it is -- when they
# are not found.
headers = ["rocwmma/rocwmma.hpp"]

# --- Cross-workgroup global memory -------------------------------------------

[[case]]
id = "global-byte-eviction"
kernel = "global_byte_eviction"
requires = []
