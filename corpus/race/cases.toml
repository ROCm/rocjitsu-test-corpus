description = "RAW from a WMMA result into a transcendental, via rocWMMA"

# A mutation that provably does not introduce a race. A detector reporting
# nothing here is correct, so the mutant is exempt from scoring rather than
# counted as a miss.
#
# `site` is checked against the instruction actually found at that ordinal when
# the manifest is generated. If codegen shifts and the ordinal lands on a
# different instruction, generation fails loudly instead of quietly excusing
# the wrong one.
[[case.exempt]]
kind = "wait"
ordinal = 3
site = "s_wait_kmcnt"
reason = "epilogue wait already satisfied by an earlier s_wait_kmcnt on the K > 0 path the kernel takes, so removing it has no effect"

# --- Cross-workgroup global memory -------------------------------------------

# The only case whose baseline is race-free by construction: every access is an
# ordinary read, and reads never race reads whatever order the workgroups run
# in. The `memory` mutation rewrites one sub-dword load as a store, the single
# edit that makes it racy, which is how the sub-dword eviction behavior of a
# global shadow gets exercised. Its mutants really are tagged global.
[[case]]
id = "global-byte-eviction"
kernel = "global_byte_eviction"
requires = []
mutate = ["memory"]
access = "global"
hazard = "GlobalMemoryRace"
waits = []
description = "Cross-workgroup sub-dword eviction under a single-byte read flood"
