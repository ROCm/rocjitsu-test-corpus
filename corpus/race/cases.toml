# Race-detection corpus: kernel-level metadata.
#
# Each case names one independently buildable HIP kernel and the hazard it is
# built to exercise. Tool-specific coverage maps can refer to these stable IDs
# without coupling this corpus to a particular detector or launch mechanism.
#
# This file describes kernels. The mutants derived from them live in
# mutants.toml, which `scripts/generate.py` writes.
#
# Fields:
#   id           stable selector, also used to build CorpusCase ids
#   kernel       basename under kernels/, without .hip
#   requires     gfx targets this kernel assembles for; empty means portable
#   mutate       mutation kinds this kernel opts into: "wait" and/or "memory"
#   access       the memory the kernel touches: global | lds | scratch.
#                This is NOT the resource a hazard lands on. Removing a loadcnt
#                wait on a global load usually produces a hazard on the
#                destination VGPR, because the race is on the register rather
#                than on memory. generate.py combines this with the removed
#                wait's counter type to tag each mutant with the resource it
#                actually races on (global/lds/scratch/vgpr/agpr/sgpr).
#   hazard       the dominant hazard kind the kernel is built to produce
#   waits        wait counters the kernel exercises
#
# Resource names are corpus-facing rather than any one detector's internal
# spelling; each adapter maps them onto its own vocabulary.

[corpus]
schema = 1
name = "race"

# --- Global vector loads -----------------------------------------------------
# These touch global memory, but a removed loadcnt wait races the destination
# register, so their mutants are tagged vgpr rather than global.

[[case]]
id = "add-checked"
kernel = "add_checked"
requires = []
mutate = ["wait"]
access = "global"
hazard = "RAW"
waits = ["loadcnt", "kmcnt"]
description = "Global vector RAW (load then use), bounds checked"

