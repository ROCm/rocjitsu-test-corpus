id = "trans-lds"
kernel = "trans_lds"
targets = []
mutate = ["wait"]
hazard = "RAW"
waits = { gfx1250 = ["dscnt", "kmcnt", "loadcnt"], gfx950 = ["lgkmcnt", "vmcnt"] }
description = "RAW from an LDS read into a transcendental"

