# One assembly solution and one 64x64x64 SGEMM shape for a quick gfx1250 smoke test.

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 1
  CpuThreads: 1
  KeepBuildTmp: true
  NumElementsToValidate: -1
  ValidationMaxToPrint: 16
  ExitOnFails: 2
  SyncsPerBenchmark: 0
  NumWarmups: 0
  EnqueuesPerSync: 1
  HardwareMonitor: false
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0

BenchmarkProblems:
  -
    - OperationType: GEMM
      DataType: S
      DestDataType: S
      ComputeDataType: S
      TransposeA: false
      TransposeB: true
      UseBeta: true
      Batched: true

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: [Assembly]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 4, 1, 1, 1, 1, 1, 1]
        - DepthU: [16]
        - WavefrontSize: [32]
        - PrefetchGlobalRead: [1]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [3]
        - SourceSwap: [false]
        - TransposeLDS: [0]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - GlobalSplitU: [1]
        - WorkGroupMapping: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [64, 64, 1, 64]
