name = "llama_pr13155_noncont_batched_matmul"
project = "llama.cpp"
runner = "runner.cpp"
upstream_repo = "https://github.com/ggml-org/llama.cpp"
llama_bug_commit = "7d3af70b089bb349b5d17eb01839224c99ec1952"
llama_fix_commit = "cdf76586b23c67abd3ca064ee2c084c57ae240bd"
ggml_base = "../../../third_party/llama.cpp/ggml"
ggml_source = "fix uses vendored GGML; bug symlinks vendored GGML and patches the affected CUDA source"
default_variant = "pr13155_fix"

[input]
description = "F16 64x32 src0 multiplied by a non-contiguous F32 src1 view with ne=[64,17,2,1], nb=[4,256,8192,16384], and view offset 256. The 17 columns avoid latest GGML's gfx1201 mul_mat_f dispatch and reach batched cuBLAS."

[validation]
argument = "--validate"
expect = "pr13155_fix passes; pr13155_bug fails after the restored PR #13155 bug block is reached through batched cuBLAS"
tolerance = 1.0e-3
