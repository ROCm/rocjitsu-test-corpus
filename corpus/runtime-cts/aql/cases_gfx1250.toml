# gfx1250 invocations, with explicit plain and metadata AQL coverage.
[defaults]
timeout_seconds = 60

[[case]]
id = "sdma_flood"
binary = "aql_sdma_flood_{target}"
args = ["--iterations", "8"]

[[case]]
id = "sdma_signal64"
binary = "aql_sdma_signal64_{target}"
args = ["--iterations", "64"]
requires = ["sdma_signal64"]

[[case]]
id = "sdma_event_interrupt"
binary = "aql_sdma_event_interrupt_{target}"
args = ["--iterations", "64"]

[[case]]
id = "packet_flood-aql-metadata-off"
# Simulator runtime exceeded 60 seconds (62.8s; TIMEOUT).
slow = true
binary = "aql_packet_flood_{target}"
args = ["--iterations", "8", "--seed", "12345", "--aql-metadata", "off"]
requires = ["aql_metadata"]

[[case]]
id = "packet_flood-aql-metadata-on"
# Simulator runtime exceeded 60 seconds (62.6s; TIMEOUT).
