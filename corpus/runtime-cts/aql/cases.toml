[[case]]
id = "aql-dispatch-oversubscribed"
binary = "aql_packet_flood_{target}"
args = ["--queues", "8", "--iterations", "1"]
status = "SKIP"
reason = "Investigate sustained AQL oversubscription: intermittent gfx1201 timeouts; short gfx1250 case passed on fw 2380 but remains outside the default run."

