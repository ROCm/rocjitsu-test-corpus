[[case]]
id = "aql_running_queue_pause"
# On kernel 6.12.2-amdsos-build64-ubuntu-24.04+ / AMDGPU 7.1.3.31500000,
# ten direct trials passed with vm_update_mode=3 (128 pause operations each).
# The default VM-update configuration still faults. For the related setup
# investigation and older-stack coredump defect, see multiprocess-aql-slow
# in ../aql/cases_gfx950.toml.
binary = "pm4_aql_running_queue_pause_{target}"
args = ["--iterations", "32"]
status = "SKIP"
reason = "Investigate: gfx950 KFD 1.23 / firmware 44 faults at the kernel trap-handler address during live-wave pause with the default VM-update configuration. CPU page-table updates (vm_update_mode=3) passed ten repeated runs; the default configuration remains unqualified."
requires = ["pm4"]

