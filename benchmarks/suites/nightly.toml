name = "nightly"
targets = ["gfx950", "gfx1250"]
warmups = 0
samples = 1
num_threads = "default"
timeout_seconds = 1200

[[cases]]
id = "gpt_oss.window_batch4_seq3072.default"
workload = "gpt_oss_attention"
suite = "GPT-OSS"
name = "Windowed attention"
operation = "Attention"
params = { dtype = "bf16", batch = 4, query_heads = 64, key_value_heads = 8, sequence = 3072, window = 128, head_dimension = 64 }

[[cases]]
id = "gpt_oss.causal_seq2560.default"
workload = "gpt_oss_attention"
suite = "GPT-OSS"
name = "Full causal attention"
operation = "Attention"
params = { dtype = "bf16", batch = 1, query_heads = 64, key_value_heads = 8, sequence = 2560, window = 0, head_dimension = 64 }

[[cases]]
id = "triton.persistent_1024x4096x4096.default"
workload = "triton_persistent"
suite = "Triton"
name = "FP16 persistent matmul"
operation = "GEMM"
params = { dtype = "fp16", rows = 1024, columns = 4096, reduction = 4096 }

[[cases]]
id = "triton.grouped_4x2048.default"
workload = "triton_grouped"
suite = "Triton"
name = "FP16 grouped GEMM"
operation = "Grouped GEMM"
params = { dtype = "fp16", rows = 2048, columns = 2048, reduction = 2048, groups = 4 }

