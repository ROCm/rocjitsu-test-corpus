name = "nightly"
targets = ["gfx950", "gfx1250"]
warmups = 3
samples = 21
num_threads = 8
timeout_seconds = 300

[[cases]]
id = "triton.copy_fp32_32m.threads8"
workload = "copy"
suite = "Triton"
name = "32 MiB contiguous FP32 copy"
operation = "Copy"
params = { elements = 8388608, dtype = "fp32" }

[[cases]]
id = "triton.vector_add_fp32_boundary.threads8"
workload = "vector_add"
suite = "Triton"
name = "Boundary FP32 vector add"
operation = "Vector add"
params = { elements = 8388611, dtype = "fp32" }

[[cases]]
id = "triton.transpose_fp16_2048.threads8"
workload = "transpose"
suite = "Triton"
name = "2048x2048 FP16 transpose"
operation = "Transpose"
params = { rows = 2048, columns = 2048, dtype = "fp16" }

[[cases]]
id = "triton.gather_fp32_irregular.threads8"
workload = "gather"
suite = "Triton"
name = "Irregular FP32 gather"
operation = "Gather"
params = { source_elements = 8388608, output_elements = 4194307, index_stride = 104729, index_offset = 17, dtype = "fp32" }

[[cases]]
id = "triton.atomic_add_fp32_contended.threads8"
workload = "atomic_add"
suite = "Triton"
name = "Contended FP32 atomic add"
operation = "Atomic add"
params = { elements = 131072, buckets = 256, dtype = "fp32" }

[[cases]]
id = "triton.softmax_fp16_aligned.threads8"
workload = "softmax"
suite = "Triton"
name = "Aligned FP16 softmax"
operation = "Softmax"
params = { rows = 64, columns = 4096, dtype = "fp16" }

[[cases]]
id = "triton.softmax_fp16_boundary.threads8"
workload = "softmax"
suite = "Triton"
name = "Boundary FP16 softmax"
operation = "Softmax"
params = { rows = 64, columns = 4097, dtype = "fp16" }

[[cases]]
id = "triton.rmsnorm_bf16.threads8"
workload = "rmsnorm"
suite = "Triton"
name = "BF16 RMSNorm"
operation = "RMSNorm"
params = { rows = 128, columns = 4096, dtype = "bf16", epsilon = 1e-05 }

[[cases]]
id = "triton.gemm_bf16_aligned.threads8"
workload = "gemm"
suite = "Triton"
name = "Aligned BF16 GEMM"
operation = "GEMM"
params = { m = 256, n = 256, k = 512, dtype = "bf16" }

[[cases]]
id = "triton.gemm_bf16_ragged.threads8"
workload = "gemm"
suite = "Triton"
name = "Ragged BF16 GEMM"
operation = "GEMM"
params = { m = 250, n = 250, k = 510, dtype = "bf16" }

[[cases]]
id = "triton.gpt_oss_attention_bf16.threads8"
workload = "gpt_oss_attention"
suite = "GPT-OSS"
name = "GPT-OSS BF16 attention"
operation = "Attention"
params = { dtype = "bf16", batch = 1, query_heads = 64, key_value_heads = 8, sequence = 128, window = 128, head_dimension = 64 }
